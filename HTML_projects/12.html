<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>

<div class="calc">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <br>
        <button class="buttons" onclick="appendValue('1')">1</button>
        <button class="buttons" onclick="appendValue('2')">2</button>
        <button class="buttons" onclick="appendValue('3')">3</button>
        <button class="buttons_op" onclick="appendValuePlus('+')">+</button>
        <button class="buttons" onclick="appendValueMinus('-')">-</button>
        <br>
        <button class="buttons" onclick="appendValue('4')">4</button>
        <button class="buttons" onclick="appendValue('5')">5</button>
        <button class="buttons" onclick="appendValue('6')">6</button>

        <button class="buttons_op" onclick="appendValueMultiply('*')">*</button>
        <button class="buttons" onclick="appendValueDivision('/')">/</button>
        <br>
        <button class="buttons" onclick="appendValue('7')">7</button>
        <button class="buttons" onclick="appendValue('8')">8</button>
        <button class="buttons" onclick="appendValue('9')">9</button>
        <button class="buttons_op" onclick="clearDisplay(), clearSheet()">C</button>
        <button class="buttons" id="result" onclick="calculateResult()">=</button>
        <br>
        <button class="buttons_null" onclick="appendValue('0')" >0</button>
    </div>
    <div>
        <h4 class="journal">Журнал</h4>
        <textarea id="calculateJournal" readonly></textarea> 
    </div>
</div>
</body>
    <script type="text/javascript" src="js/script.js"></script>
</html>
